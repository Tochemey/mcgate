<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23B598"/>
      <stop offset="100%" stop-color="#0C7E68"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Logomark: hexagon frame, gate posts, node path through the gate -->
  <g>
    <!-- Outer hexagon (pointy-top), teal gradient -->
    <polygon points="380,105 679,277.5 679,622.5 380,795 81,622.5 81,277.5"
             fill="none" stroke="url(#teal)" stroke-width="52" stroke-linejoin="round"/>
    <!-- Inner hexagon, navy -->
    <polygon points="380,180 614,315 614,585 380,720 146,585 146,315"
             fill="#FFFFFF" stroke="#1C2540" stroke-width="20" stroke-linejoin="round"/>

    <!-- Gate posts -->
    <rect x="298" y="360" width="26" height="180" rx="13" fill="#1C2540"/>
    <rect x="436" y="360" width="26" height="180" rx="13" fill="#1C2540"/>

    <!-- Connection line through the gate -->
    <line x1="230" y1="450" x2="530" y2="450" stroke="#1C2540" stroke-width="20"/>

    <!-- Nodes: outside, at the gate, inside -->
    <circle cx="230" cy="450" r="34" fill="#189A82" stroke="#1C2540" stroke-width="16"/>
    <circle cx="380" cy="450" r="34" fill="#3D7BE8" stroke="#1C2540" stroke-width="16"/>
    <circle cx="530" cy="450" r="34" fill="#189A82" stroke="#1C2540" stroke-width="16"/>
  </g>

  <!-- Wordmark -->
  <text x="740" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="185" font-weight="800" letter-spacing="-4" fill="#1C2540">mc<tspan fill="#0C7E68">gate</tspan></text>
  <text x="746" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="500" fill="#5A6478">The supervised MCP gateway kit for Go</text>
</svg>
